name: EasyMAA screenshots
# Every 30 minutes a cheap Linux job checks answerzx/EasyMAA main; when it has a
# commit without screenshots yet, a macOS job runs scripts/ci_screenshots.sh
# from EasyMAA and pushes the PNGs to the `shots` branch (shots/<sha>/).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: EasyMAA ref (branch, tag or sha); empty = main
        default: ''
permissions:
  contents: write
concurrency:
  group: screenshots
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.c.outputs.sha }}
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          REF: ${{ inputs.ref }}
        run: |
          ref=${REF:-main}
          sha=$(git ls-remote "https://x-access-token:$TOKEN@github.com/answerzx/EasyMAA.git" "$ref" | head -1 | cut -c1-40)
          [ -z "$sha" ] && sha=$ref
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          done=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/shots/latest.txt" | cut -d' ' -f1)
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "${sha:0:7}" != "$done" ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
  shots:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: answerzx/EasyMAA
          ref: ${{ needs.check.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Capture
        id: cap
        continue-on-error: true
        run: bash src/scripts/ci_screenshots.sh "$GITHUB_WORKSPACE/out"
      - name: Publish to shots branch
        if: always()
        run: |
          SHA=$(git -C src rev-parse --short=7 HEAD)
          cd "$GITHUB_WORKSPACE"
          git init -q pub && cd pub
          git config user.name "screenshots-bot"; git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin shots && git checkout -q -b shots FETCH_HEAD || git checkout -q --orphan shots
          rm -rf "shots/$SHA"; mkdir -p "shots/$SHA"; cp ../out/* "shots/$SHA/" 2>/dev/null || true
          echo "$SHA ${{ steps.cap.outcome }} $(date -u +%FT%TZ)" > latest.txt
          git add -A && git commit -qm "shots $SHA" && git push -q origin shots
